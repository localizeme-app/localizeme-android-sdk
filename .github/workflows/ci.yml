name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Unit tests, the release library, the instrumented tests compiled (they
      # need an emulator to run), and the local publish JitPack builds tags with.
      - run: >-
          ./gradlew
          :localizeme:testDebugUnitTest
          :localizeme:assembleRelease
          :localizeme:assembleDebugAndroidTest
          :localizeme:publishToMavenLocal
